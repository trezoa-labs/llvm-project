# This workflow will test the llvm-trezoa-tests workflow in PRs
# targetting the main branch.  Since this workflow doesn't normally
# run on main PRs, we need some way to test it to ensure new updates
# don't break it.

name: LLVM Workflow Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/llvm-trezoa-tests.yml'
      - '.github/workflows/llvm-trezoa-workflow-tests.yml'

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  llvm-test:
    if: github.repository_owner == 'llvm'
    name: Build and Test
    uses: ./.github/workflows/llvm-trezoa-tests.yml
    with:
      build_target: check-all
      projects: clang;lld;libclc;lldb
